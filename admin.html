<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#050914"><title>Bizu X — Administrador</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 80% 0,rgba(239,68,91,.12),transparent 32%),#050914;color:#f7f9fd;font:14px Inter,system-ui}.card{width:min(470px,100%);padding:38px;border-radius:24px;background:#0a1425;border:1px solid rgba(106,137,190,.25);box-shadow:0 30px 90px #0008}.logo{width:82px;height:82px;border-radius:20px;object-fit:cover}.ey{display:block;color:#ff7f90;font-size:10px;font-weight:900;letter-spacing:.16em;margin-top:22px}h1{font-size:30px;margin:8px 0}p{color:#91a3c2}.field{display:grid;gap:6px;margin-top:14px}.field label{font-size:11px;font-weight:850}.field input{padding:13px;border-radius:11px;border:1px solid #283a5a;background:#07101e;color:#fff}button{width:100%;padding:14px;margin-top:18px;border:0;border-radius:11px;background:linear-gradient(135deg,#ef445b,#c92844);color:#fff;font-weight:900;cursor:pointer}.msg{display:none;margin-top:12px;padding:10px;border:1px solid #6b2935;background:#31131b;color:#ffb1bc;border-radius:10px}.msg.show{display:block}.loading{position:fixed;inset:0;background:#050914;display:none;place-items:center}.loading.show{display:grid}</style></head><body><main class="card"><div class="logo" style="display:grid;place-items:center;font-size:24px;font-weight:950;color:#fff;background:linear-gradient(135deg,#17366a,#ef445b)">X</div><span class="ey">ÁREA RESTRITA</span><h1>Administrador</h1><p>Gerencie conteúdos, concursos e usuários do Bizu do Concurseiro X.</p><form id="form"><div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>Senha</label><input id="password" type="password" autocomplete="current-password" required></div><button id="go">Entrar no ADMIN</button></form><div id="msg" class="msg"></div></main><div id="loading" class="loading"><b>Carregando painel administrativo…</b></div><script>const msg=document.getElementById('msg'),loading=document.getElementById('loading');function fail(t){msg.textContent=t;msg.classList.add('show')}async function mount(){loading.classList.add('show');let r=await fetch('/private/admin',{cache:'no-store'});if(r.status===403){loading.classList.remove('show');fail('Esta conta não possui permissão de administrador.');return}if(!r.ok){loading.classList.remove('show');throw Error('private')}document.open();document.write(await r.text());document.close()}async function check(){try{let r=await fetch('/api/session',{cache:'no-store'});if(r.ok){let s=await r.json();if(s.role==='admin')return mount()}}catch{}}form.addEventListener('submit',async e=>{e.preventDefault();msg.classList.remove('show');go.disabled=true;try{let r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:email.value.trim(),password:password.value})});if(!r.ok){fail('E-mail ou senha inválidos.');return}let s=await fetch('/api/session',{cache:'no-store'}),d=s.ok?await s.json():null;if(!d||d.role!=='admin'){await fetch('/api/logout',{method:'POST'});fail('Conta sem permissão de administrador.');return}await mount()}catch{fail('Não foi possível conectar agora.')}finally{go.disabled=false}});check();</script></body></html>
