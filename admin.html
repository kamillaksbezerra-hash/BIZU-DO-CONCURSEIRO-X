<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#050914"><title>Bizu X — Administrador</title><style>*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 80% 0,rgba(239,68,91,.12),transparent 32%),#050914;color:#f7f9fd;font:14px Inter,system-ui}.card{position:relative;z-index:3;width:min(470px,100%);padding:38px;border-radius:24px;background:#0a1425;border:1px solid rgba(106,137,190,.25);box-shadow:0 30px 90px #0008}.logo{width:82px;height:82px;border-radius:20px;display:grid;place-items:center;font-size:24px;font-weight:950;color:#fff;background:linear-gradient(135deg,#17366a,#ef445b)}.ey{display:block;color:#ff7f90;font-size:10px;font-weight:900;letter-spacing:.16em;margin-top:22px}h1{font-size:30px;margin:8px 0}p{color:#91a3c2}.card form,.field{position:relative;z-index:4}.field{display:grid;gap:6px;margin-top:14px}.field label{font-size:11px;font-weight:850}.field input{position:relative;z-index:5;width:100%;padding:13px;border-radius:11px;border:1px solid #283a5a;background:#07101e;color:#fff;outline:none;pointer-events:auto!important;user-select:text!important;-webkit-user-select:text!important;caret-color:#fff;opacity:1}.field input:focus{border-color:#ef6b7d;box-shadow:0 0 0 3px rgba(239,68,91,.12)}button{position:relative;z-index:5;width:100%;padding:14px;margin-top:18px;border:0;border-radius:11px;background:linear-gradient(135deg,#ef445b,#c92844);color:#fff;font-weight:900;cursor:pointer}.msg{display:none;margin-top:12px;padding:10px;border:1px solid #6b2935;background:#31131b;color:#ffb1bc;border-radius:10px}.msg.show{display:block}.loading{position:fixed;inset:0;background:#050914;display:none;place-items:center;z-index:20;text-align:center}.loading.show{display:grid}</style></head><body><main class="card"><div class="logo">X</div><span class="ey">ÁREA RESTRITA</span><h1>Administrador</h1><p>Gerencie conteúdos, concursos e usuários do Bizu do Concurseiro X.</p><form id="form" novalidate><div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false" required></div><div class="field"><label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><button id="go" type="submit">Entrar no ADMIN</button></form><div id="msg" class="msg"></div></main><div id="loading" class="loading" aria-hidden="true"><b id="loadingText">Validando perfil…</b></div><script>(()=>{const form=document.getElementById('form'),emailInput=document.getElementById('email'),passwordInput=document.getElementById('password'),go=document.getElementById('go'),msg=document.getElementById('msg'),loading=document.getElementById('loading'),loadingText=document.getElementById('loadingText');let navigating=false;function fail(t){msg.textContent=t;msg.classList.add('show')}function clear(){msg.textContent='';msg.classList.remove('show')}function busy(on){loading.classList.toggle('show',!!on);loading.setAttribute('aria-hidden',on?'false':'true')}async function fetchTimed(url,options={},ms=20000){const c=new AbortController(),timer=setTimeout(()=>c.abort(),ms);try{return await fetch(url,{...options,signal:c.signal,cache:'no-store'})}finally{clearTimeout(timer)}}const clearOldSession=fetch('/api/logout',{method:'POST',cache:'no-store'}).catch(()=>null);form.addEventListener('submit',async ev=>{ev.preventDefault();clear();const email=emailInput.value.trim().toLowerCase(),password=passwordInput.value;if(!email||!password){fail('Digite seu e-mail e sua senha.');(email?passwordInput:emailInput).focus();return}go.disabled=true;go.textContent='Entrando…';try{await clearOldSession;await fetch('/api/logout',{method:'POST',cache:'no-store'}).catch(()=>null);const r=await fetchTimed('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email,password})},25000);if(!r.ok){if(r.status===429)fail('Muitas tentativas. Aguarde alguns minutos e tente novamente.');else fail('E-mail ou senha inválidos.');return}const sr=await fetchTimed('/api/session',{},20000),d=sr.ok?await sr.json():null;const sessionEmail=String(d&&d.user&&d.user.email||'').trim().toLowerCase();if(!d||!sr.ok||sessionEmail!==email){await fetch('/api/logout',{method:'POST',cache:'no-store'}).catch(()=>null);fail('A sessão não foi iniciada corretamente. Tente novamente.');return}navigating=true;busy(true);if(d.role!=='admin'){loadingText.textContent='Conta de aluno detectada. Abrindo sua área…';window.location.replace('/private/app');return}loadingText.textContent='Abrindo painel administrativo…';window.location.replace('/private/admin')}catch(e){busy(false);fail('Não foi possível conectar agora. Tente novamente.')}finally{if(!navigating){go.disabled=false;go.textContent='Entrar no ADMIN'}}});requestAnimationFrame(()=>emailInput.focus({preventScroll:true}))})();</script></body></html>
